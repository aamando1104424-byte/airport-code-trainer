# Netlify reads this file automatically.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# No catch-all redirect: the app has no other pages, so unknown addresses get a small 404
# instead of the whole app (bots probing for /wp-login.php and the like no longer cost bandwidth).
# Response headers (security policy, caching) are written to dist/_headers by vite.config.js.

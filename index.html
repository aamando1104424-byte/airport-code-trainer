<!doctype html>
<html lang="en" data-mode="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#090F15">
    <meta name="description" content="Learn U.S. airport codes: lessons with memory tricks, practice drills, two arcade games and a world leaderboard.">
    <title>Airport Code Trainer</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23FDCA3A'/%3E%3Cpath transform='translate(16 16) rotate(-38) scale(1.05)' fill='%23090F15' d='M10 0C10-.9 9.2-1.3 8-1.3H-7.4L-10-.5V.5L-7.4 1.3H8C9.2 1.3 10 .9 10 0ZM1.8-1.2L-5.2-9.4H-6.6L-3.4-1.2ZM1.8 1.2L-5.2 9.4H-6.6L-3.4 1.2ZM-7.2-1L-9.6-4.4H-10.4L-9.2-.8ZM-7.2 1L-9.6 4.4H-10.4L-9.2.8Z'/%3E%3C/svg%3E">
    <script>
      // Light / Dark / Auto and the color theme, applied before the first paint so the page never flashes.
      // Same rules as src/themes.js: Dark unless this browser picked something else.
      (function () {
        var d = document.documentElement, m = null, t = null;
        try { m = localStorage.getItem('act-ui-mode'); t = localStorage.getItem('act-color-mode'); } catch (e) {}
        if (m !== 'light' && m !== 'dark' && m !== 'auto') m = 'dark';
        if (m === 'auto') m = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        d.setAttribute('data-mode', m);
        if (t && /^(forest|red|orange|blue|purple|pink|ice|mono)$/.test(t)) d.setAttribute('data-crt', t);
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&family=JetBrains+Mono:wght@500;600;700;800&display=swap">
  </head>
  <body>
    <div id="root"></div>
    <noscript><p style="font:16px system-ui;padding:24px">Airport Code Trainer needs JavaScript turned on.</p></noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
